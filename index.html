<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="dark" />

    <!-- Font preloads (Plus Jakarta Sans for display, Inter for UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />

    <!-- Primary meta -->
    <title>Duo Wish — Wish Projects × Giftful for iPhone Duo</title>
    <meta
      name="description"
      content="Duo Wish brings curated scrapbooking and social wishlist sharing to iPhone Duo. Closed 5.4″ all-wishes matrix, 7.6″ high-res dual-pane Wishes Canvas, and tabletop Inverted-V share sheet."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Duo Wish" />
    <meta property="og:title" content="Duo Wish — Wishlists that share themselves across both halves of iPhone Duo" />
    <meta
      property="og:description"
      content="Wishlists that share themselves across both halves of your iPhone Duo. Seamless Giftful integration, tabletop tent share moments, and high-res dual-pane scrapbooks."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Duo Wish — Wish Projects × Giftful for iPhone Duo" />
    <meta
      name="twitter:description"
      content="Wishlists that share themselves across both halves of your iPhone Duo."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
